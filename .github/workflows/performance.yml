name: Mobile performance and accessibility budgets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "performance-budgets.json"
      - "lighthouserc.json"
      - "scripts/check_performance_budgets.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:assets
      - name: Check deterministic payload budgets
        run: python scripts/check_performance_budgets.py
      - name: Serve the committed artifact
        run: python scripts/serve_static_gzip.py --port 4173 --directory site >/tmp/nhl-tracker-http.log 2>&1 &
      - name: Check throttled mobile LCP and accessibility
        run: pnpm exec lhci autorun
