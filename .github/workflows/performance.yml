name: Mobile performance and accessibility budgets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "performance-budgets.json"
      - "lighthouserc.json"
      - "scripts/check_performance_budgets.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.9.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check deterministic payload budgets
        run: python scripts/check_performance_budgets.py
      - name: Serve the committed artifact
        run: python scripts/serve_static_gzip.py --port 4173 --directory site >/tmp/nhl-tracker-http.log 2>&1 &
      - name: Check throttled mobile LCP and accessibility
        run: pnpm exec lhci autorun
