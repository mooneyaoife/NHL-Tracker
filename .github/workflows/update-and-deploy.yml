name: Generate scheduled NHL data

on:
  workflow_dispatch:
  schedule:
    # Refresh the full league schedule every two hours. This picks up NHL start-time
    # changes quickly while the app continues to render them in Europe/London time.
    - cron: "20 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nhl-tracker-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Update NHL data
        run: |
          for attempt in 1 2; do
            if python scripts/update_tracker.py; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "NHL update failed once; retrying in 30 seconds."
              sleep 30
            fi
          done
          exit 1
      - name: Validate generated data and application contracts
        run: |
          python scripts/generate_build_metadata.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check site/app.js
          node --check site/game-centre.js
          node --check site/game-state.js
          node --check site/cloudflare-live.js
          node --check site/statistics.js
          node tests/game_state.test.js
          node tests/cloudflare_live_overlay.test.js
          node tests/live_updates.test.js
          node tests/game_centre.test.js
          node --check site/sw.js
          node tests/frontend_statistics.test.js
          node tests/data_integrity.test.js
          node tests/site_contract.test.js
          node tests/workflow_contract.test.js
          node tests/url_safety.test.js
          python scripts/validate_mail_feed.py
      - name: Check and summarize generated artifact
        env:
          MAX_FRESH_AGE_HOURS: ${{ vars.MAX_FRESH_ARTIFACT_AGE_HOURS || '24' }}
          MAX_FALLBACK_AGE_HOURS: ${{ vars.MAX_FALLBACK_ARTIFACT_AGE_HOURS || '72' }}
        run: >-
          python scripts/check_artifact_health.py
          --max-fresh-age-hours "$MAX_FRESH_AGE_HOURS"
          --max-fallback-age-hours "$MAX_FALLBACK_AGE_HOURS"
      - name: Save generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/build-meta.json data/cache
          git diff --cached --quiet || git commit -m "Update NHL data"
          git push
